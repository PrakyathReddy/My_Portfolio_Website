name: Mana Muchatlu

# Separate from deploy.yml on purpose: the journal has its own bucket, its own
# distribution and its own blast radius. A portfolio change must never be able
# to touch it, and vice versa.

on:
  pull_request:
    paths:
      - 'mana-muchatlu/**'
      - '.github/workflows/deploy-journal.yml'
  push:
    branches:
      - main
    paths:
      - 'mana-muchatlu/**'
      - '.github/workflows/deploy-journal.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        default: 'app'
        type: choice
        options: [app, web, api, all]

permissions:
  contents: read

concurrency:
  # Never let two deploys race for the same bucket.
  group: journal-production-deploy
  cancel-in-progress: false

jobs:
  test:
    # Runs on pull requests too, not just on the way to production - tests that
    # only gate the deploy are tests that tell you after it is too late.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --omit=dev --prefix mana-muchatlu --no-audit --no-fund

      - name: Run journal tests
        # The API's pure logic - auth, validation, key construction - is what
        # a bug would be silent in.
        run: npm run test:journal

      - name: Run portfolio tests
        # The journal shares this repo, so it also has to leave the portfolio
        # suite green.
        run: npm test

      - name: Check shell scripts parse
        run: |
          bash -n mana-muchatlu/infra/deploy.sh
          bash -n mana-muchatlu/infra/init-secrets.sh
          bash -n mana-muchatlu/infra/configure-reminders.sh

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify access to the existing journal stacks
        # The live journal is already bootstrapped. A missing stack or denied
        # AWS permission must fail this run instead of reporting a skipped
        # deployment as a success.
        run: |
          for stack in mana-muchatlu-data mana-muchatlu-web; do
            aws cloudformation describe-stacks --stack-name "$stack" \
              --region us-east-1 --query 'Stacks[0].StackStatus' --output text
          done

      - name: Deploy API code, frontend and CloudFront invalidation
        env:
          PROJECT_NAME: mana-muchatlu
          DOMAIN_NAME: mana-muchatlu-shivani.prakyath.dev
          APEX_DOMAIN: prakyath.dev
        run: |
          chmod +x mana-muchatlu/infra/deploy.sh
          ./mana-muchatlu/infra/deploy.sh "${{ inputs.target || 'app' }}"
