name: Deploy to Amazon S3

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'mana-muchatlu/**'
      - '.github/workflows/deploy-journal.yml'

permissions:
  contents: read

concurrency:
  group: portfolio-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync website to S3
        run: |
          aws s3 sync . s3://my-devops-portfolio-website \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "mana-muchatlu/*" \
            --exclude "node_modules/*" \
            --exclude "__tests__/*" \
            --exclude ".kiro/*" \
            --exclude ".vscode/*" \
            --exclude ".DS_Store"

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "::warning::CLOUDFRONT_DISTRIBUTION_ID is not configured. S3 deployment succeeded, but CloudFront cache was not invalidated."
            exit 0
          fi

          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
